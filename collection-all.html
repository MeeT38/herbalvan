<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>HerbalVan — Coming Soon</title>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/coming-soon.css">
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png">
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
</head>
<body>
    <main class="coming-soon">
        <div class="coming-soon__decor" aria-hidden="true">
            <i class="fa-solid fa-leaf coming-soon__leaf coming-soon__leaf--left"></i>
            <i class="fa-solid fa-leaf coming-soon__leaf coming-soon__leaf--right"></i>
        </div>

        <section class="coming-soon__card">
            <img class="coming-soon__logo" src="images/site/logo/45/1200.webp" srcset="images/site/logo/45/400.webp 400w, images/site/logo/45/800.webp 800w, images/site/logo/45/1200.webp 1200w" sizes="(max-width: 640px) 200px, 240px" width="2084" height="648" alt="HerbalVan">

            <p class="coming-soon__eyebrow">Pure Herbs · Simple Rituals</p>

            <h1 class="coming-soon__title">
                <span class="coming-soon__title-coming">Coming</span>
                <span class="coming-soon__title-soon">Soon</span>
            </h1>

            <p class="coming-soon__tagline">Something <em>pure</em> is on the way.</p>

            <p class="coming-soon__lede">We&rsquo;re working hard to bring you a natural and better alternative.</p>

            <p class="coming-soon__rule" aria-hidden="true"><span></span><i class="fa-solid fa-leaf"></i><span></span></p>

            <ul class="coming-soon__promises">
                <li class="coming-soon__promise">
                    <span class="coming-soon__badge" aria-hidden="true"><i class="fa-solid fa-leaf"></i></span>
                    <span class="coming-soon__promise-label">Natural Ingredients</span>
                </li>
                <li class="coming-soon__promise">
                    <span class="coming-soon__badge" aria-hidden="true"><i class="fa-solid fa-flask"></i></span>
                    <span class="coming-soon__promise-label">No Harmful Chemicals</span>
                </li>
                <li class="coming-soon__promise">
                    <span class="coming-soon__badge" aria-hidden="true"><i class="fa-solid fa-seedling"></i></span>
                    <span class="coming-soon__promise-label">A Cleaner Tomorrow</span>
                </li>
            </ul>
        </section>
    </main>
</body>
</html>
